name: Qwil
description: >-
  Qwil (qwil.co) is a financial-technology company and a 500 Global portfolio
  company. It operates a consumer-facing web and mobile application ("Qwil
  WebApp" at app.qwil.com) backed by a private, authenticated REST API at
  api.qwil.co. The platform connects to users' bank accounts through Plaid and
  uses Firebase Authentication (Google Identity Platform) for identity, with
  bearer tokens presented to a Django REST Framework API. Qwil does not publish
  a public API specification, developer portal, or SDK documentation; the API is
  private and partner-gated. Note that qwil.co is distinct from Qwil Messenger
  (qwil.io), an unrelated secure client-collaboration platform. This profile was
  enriched by live probing of Qwil's public network surface; most standard
  developer artifacts are unavailable because Qwil exposes no public developer
  program.
